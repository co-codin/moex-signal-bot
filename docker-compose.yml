services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moex_signal_bot}
      POSTGRES_USER: ${POSTGRES_USER:-moex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://moex:change-me@postgres:5432/moex_signal_bot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy

  scanner-scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "moex_signal_bot", "--scanner-scheduler"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://moex:change-me@postgres:5432/moex_signal_bot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCANNER_QUEUE_KEY: ${SCANNER_QUEUE_KEY:-moex:scanner:stream}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scanner-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "moex_signal_bot", "--scanner-worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://moex:change-me@postgres:5432/moex_signal_bot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCANNER_QUEUE_KEY: ${SCANNER_QUEUE_KEY:-moex:scanner:stream}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
